name: SBOM & Binary Management

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ag-prueba-front/package-lock.json'
      - '**/pom.xml'

permissions:
  pull-requests: write
  contents: read

jobs:
  sbom-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            ag-prueba-front/package-lock.json
            **/pom.xml

      - name: Run SBOM Security Audit
        if: steps.changed-files.outputs.any_changed == 'true'
        continue-on-error: true
        run: |
          echo "## 🛡️ Aviso: Modificación detectada en el SBOM" > sbom-report.md
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -q "package-lock.json"; then
            cd ag-prueba-front && npm audit >> ../sbom-report.md || echo "- ⚠️ Riesgo en Front." >> ../sbom-report.md
            cd ..
          fi
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -q "pom.xml"; then
            cd authorization-server && ./mvnw dependency-check:check >> ../sbom-report.md || echo "- ⚠️ Riesgo en Backend." >> ../sbom-report.md
          fi

      - name: Post SBOM Notice to PR
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file sbom-report.md

  archive-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment (Java & Node)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Tarea: Compilación de binarios
      - name: Build Projects
        run: |
          cd authorization-server && ./mvnw clean package -DskipTests
          cd ../resource-server && ./mvnw clean package -DskipTests
          cd ../ag-prueba-front && npm ci --legacy-peer-deps && npm run build -- --configuration=production

      # Tarea: Versionado y Almacenamiento (Upload Artifact)
      - name: Version and Store Binaries
        uses: actions/upload-artifact@v4
        with:
          # Se versiona con el SHA del commit para asegurar inmutabilidad
          name: binary-bundle-${{ github.sha }}
          path: |
            **/target/*.jar
            ag-prueba-front/dist/
          retention-days: 90