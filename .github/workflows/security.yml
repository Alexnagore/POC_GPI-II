name: SBOM Change Monitor

on:
  pull_request:
    branches: [ "main" ]
    # Se activa específicamente cuando se modifican archivos del SBOM
    paths:
      - 'ag-prueba-front/package-lock.json'
      - '**/pom.xml'

permissions:
  pull-requests: write
  contents: read

jobs:
  sbom-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para comparar cambios entre ramas

      - name: Set up Environment (JDK 17 & Node 20)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- TAREA: DETECTAR QUÉ PARTE DEL SBOM CAMBIÓ ---
      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            ag-prueba-front/package-lock.json
            **/pom.xml

      # --- TAREA: AUDITORÍA Y GENERACIÓN DE AVISO ---
      - name: Run SBOM Security Audit
        if: steps.changed-files.outputs.any_changed == 'true'
        id: audit
        continue-on-error: true
        run: |
          echo "## 🛡️ Aviso: Modificación detectada en el SBOM" > sbom-report.md
          echo "Se han detectado cambios en las librerías del proyecto. A continuación el análisis de riesgo:" >> sbom-report.md
          
          # Auditoría Frontend si cambió package-lock.json
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -q "package-lock.json"; then
            echo "### 📦 Frontend (Angular)" >> sbom-report.md
            cd ag-prueba-front && npm audit >> ../sbom-report.md || echo "- ⚠️ Se encontraron vulnerabilidades en las nuevas dependencias de Front." >> ../sbom-report.md
            cd ..
          fi
          
          # Auditoría Backend si cambió algún pom.xml
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -q "pom.xml"; then
            echo "### ☕ Backend (Java)" >> sbom-report.md
            cd authorization-server && ./mvnw dependency-check:check >> ../sbom-report.md || echo "- ⚠️ Riesgos detectados en el inventario de Backend." >> ../sbom-report.md
          fi

      # --- TAREA: PUBLICAR ANUNCIO EN LA PR ---
      - name: Post SBOM Notice to PR
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file sbom-report.md