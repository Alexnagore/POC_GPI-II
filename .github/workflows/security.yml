name: Security

on:
  pull_request:
    branches: [ "main" ]

permissions:
  pull-requests: write
  contents: read

jobs:
  # --- JOB 1: ESCANEO DE SECRETOS (Independiente) ---
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Secret Scan
        id: secrets
        run: |
          pip install detect-secrets
          # Escaneo contra el baseline. Si detecta algo nuevo, el exit code será distinto de 0.
          if ! detect-secrets scan --baseline .secrets.baseline > potential_secrets.json; then
            echo "❌ ERROR: Se han detectado posibles secretos nuevos."
            exit 1
          fi

      - name: Upload Secret Scan Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: potential-secrets-${{ github.sha }}
          path: potential_secrets.json

  # --- JOB 2: AUDITORÍA DE LIBRERÍAS (SBOM) ---
  sbom-audit:
    runs-on: ubuntu-latest
    # Este job puede correr en paralelo con secret-scan para ahorrar tiempo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Environment (JDK 17 & Node 20)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-prueba-front/package-lock.json

      - name: Run SBOM Security Audit
        id: audit
        continue-on-error: true
        run: |
          echo "## 🛡️ Reporte de Dependencias (SBOM)" > pr-summary.md
          
          echo "### 📦 Frontend" >> pr-summary.md
          (cd ag-prueba-front && npm audit | tail -n 15) >> pr-summary.md || echo "- ⚠️ Vulnerabilidades detectadas en Front." >> pr-summary.md

          echo -e "\n### ☕ Backend" >> pr-summary.md
          # Aplicamos -Dcheckstyle.skip para evitar bloqueos por formato [cite: 2025-12-13]
          (cd authorization-server && ./mvnw dependency-check:check -Dcheckstyle.skip -DskipTests > full-log-back.txt) || echo "- ⚠️ Riesgos detectados en Java." >> pr-summary.md
          
          head -c 60000 pr-summary.md > final-comment.md

      - name: Upload SBOM Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-reports-${{ github.sha }}
          path: "**/target/dependency-check-report.html"

      - name: Post Security Notice to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f final-comment.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file final-comment.md
          fi

  # --- JOB 3: COMPILACIÓN (Depende de los anteriores) ---
  archive-binaries:
    runs-on: ubuntu-latest
    needs: [secret-scan, sbom-audit] # Solo compila si los otros jobs terminan
    steps:
      - uses: actions/checkout@v4
      - name: Setup Build Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-prueba-front/package-lock.json

      - name: Build Projects
        run: |
          # Mantenemos el skip de Checkstyle para asegurar la Disponibilidad del binario [cite: 2025-12-13]
          (cd authorization-server && ./mvnw clean package -DskipTests -Dcheckstyle.skip)
          (cd resource-server && ./mvnw clean package -DskipTests -Dcheckstyle.skip)
          (cd ag-prueba-front && npm ci --legacy-peer-deps && npm run build -- --configuration=production)

      - name: Store Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binary-bundle-${{ github.sha }}
          path: |
            **/target/*.jar
            ag-prueba-front/dist/
          retention-days: 90
