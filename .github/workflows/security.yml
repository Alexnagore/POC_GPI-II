name: Security

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ag-prueba-front/package-lock.json'
      - '**/pom.xml'

permissions:
  pull-requests: write
  contents: read

jobs:
  sbom-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- NUEVO: ESCANEO DE SECRETOS (Detección de claves) ---
      - name: Set up Python (for detect-secrets)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Secret Scan
        id: secrets
        run: |
          pip install detect-secrets
          echo "### 🔍 Auditoría de Secretos" > secrets-report.md
          # Escaneamos comparando con el baseline que subiste al repo
          if ! detect-secrets scan --baseline .secrets.baseline > potential_secrets.json; then
            echo "- ❌ **ERROR:** Se han detectado posibles secretos nuevos que no están en el baseline." >> secrets-report.md
            echo "Por favor, revísalos o actualiza el baseline localmente." >> secrets-report.md
            exit 1
          else
            echo "- ✅ No se han detectado secretos nuevos fuera del baseline." >> secrets-report.md
          fi

      # --- Auditoría de Librerías (SBOM) ---
      - name: Set up Environment (JDK 17 & Node 20)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-prueba-front/package-lock.json

      - name: Run SBOM Security Audit
        id: audit
        continue-on-error: true # Permite generar el reporte aunque haya vulnerabilidades
        run: |
          echo "## 🛡️ Aviso: Reporte de Seguridad Consolidado" > pr-summary.md
          cat secrets-report.md >> pr-summary.md
          echo -e "\n---\n" >> pr-summary.md
          echo "### 📦 Resumen de Dependencias (SBOM)" >> pr-summary.md
          
          # Auditoría Front
          echo "#### Frontend" >> pr-summary.md
          (cd ag-prueba-front && npm audit | tail -n 15) >> pr-summary.md || echo "- ⚠️ Vulnerabilidades detectadas en Front." >> pr-summary.md

          # Auditoría Back
          echo -e "\n#### Backend" >> pr-summary.md
          (cd authorization-server && ./mvnw dependency-check:check -Dcheckstyle.skip -DskipTests > full-log-back.txt) || echo "- ⚠️ Se han detectado riesgos en el SBOM de Java." >> pr-summary.md
          
          # Preparación del comentario final
          head -c 60000 pr-summary.md > final-comment.md
          echo -e "\n\n> El reporte completo está disponible en los **Artifacts**." >> final-comment.md

      - name: Upload Full Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-security-reports-${{ github.sha }}
          path: |
            **/target/dependency-check-report.html
            potential_secrets.json

      - name: Post Security Notice to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f final-comment.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file final-comment.md
          fi

  archive-binaries:
    runs-on: ubuntu-latest
    needs: sbom-audit
    steps:
      - uses: actions/checkout@v4
      - name: Setup Build Environment (Java & Node)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-prueba-front/package-lock.json

      - name: Build Projects
        run: |
          (cd authorization-server && ./mvnw clean package -DskipTests -Dcheckstyle.skip)
          (cd resource-server && ./mvnw clean package -DskipTests -Dcheckstyle.skip)
          (cd ag-prueba-front && npm ci --legacy-peer-deps
