name: SBOM & Binary Management

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ag-prueba-front/package-lock.json'
      - '**/pom.xml'

permissions:
  pull-requests: write
  contents: read

jobs:
  sbom-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Environment (JDK 17 & Node 20)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run SBOM Security Audit
        id: audit
        continue-on-error: true
        run: |
          echo "## 🛡️ Aviso: Modificación detectada en el SBOM" > pr-summary.md
          echo "Se han detectado cambios en las librerías. El reporte completo está disponible en los **Artifacts** de esta ejecución." >> pr-summary.md
          
          # Auditoría Front: Solo capturamos el resumen final (últimas 20 líneas)
          echo "### 📦 Resumen Frontend" >> pr-summary.md
          cd ag-prueba-front && npm audit | tail -n 20 >> ../pr-summary.md || echo "- ⚠️ Vulnerabilidades detectadas en Front." >> ../pr-summary.md
          cd ..

          # Auditoría Back: Ejecutamos y avisamos del resultado
          echo "### ☕ Resumen Backend" >> pr-summary.md
          cd authorization-server && ./mvnw dependency-check:check > full-log-back.txt || echo "- ⚠️ Se han detectado riesgos en el SBOM de Java." >> ../pr-summary.md
          
          # Aseguramos que el mensaje para la PR no exceda el límite técnico
          head -c 60000 pr-summary.md > final-comment.md
          echo "... (Reporte resumido para la PR)" >> final-comment.md

      # Tarea: Guardar el reporte completo como evidencia (Versionado)
      - name: Upload Full Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: full-security-reports-${{ github.sha }}
          path: "**/target/dependency-check-report.html"

      # Tarea: Publicar el aviso resumido en la PR
      - name: Post SBOM Notice to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f final-comment.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file final-comment.md
          fi

  archive-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment (Java & Node)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Tarea: Compilación de binarios
      - name: Build Projects
        run: |
          cd authorization-server && ./mvnw clean package -DskipTests
          cd ../resource-server && ./mvnw clean package -DskipTests
          cd ../ag-prueba-front && npm ci --legacy-peer-deps && npm run build -- --configuration=production

      # Tarea: Versionado y Almacenamiento (Upload Artifact)
      - name: Version and Store Binaries
        uses: actions/upload-artifact@v4
        with:
          # Se versiona con el SHA del commit para asegurar inmutabilidad
          name: binary-bundle-${{ github.sha }}
          path: |
            **/target/*.jar
            ag-prueba-front/dist/
          retention-days: 90