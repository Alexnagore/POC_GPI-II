name: CI - Full Container Validation

on:
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Construcción de binarios (Para asegurar que el código es válido)
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 & Node 18
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build All (Skip Tests)
        run: |
          chmod +x authorization-server/mvnw resource-server/mvnw
          cd authorization-server && ./mvnw clean package -DskipTests
          cd ../resource-server && ./mvnw clean package -DskipTests

  # 2. Validación de Orquestación (Levantar los 3 dockers)
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Creamos un .env ficticio para que el Auth Server no falle al arrancar
      - name: Create Mock Env
        run: |
          echo "GOOGLE_CLIENT_ID=ci_test_id" > .env
          echo "GOOGLE_CLIENT_SECRET=ci_test_secret" >> .env

      - name: Lift Containers
        # Usamos tu comando de start.sh pero en modo 'detached' (-d)
        run: docker-compose up --build -d

      - name: Verify Containers Status
        run: |
          sleep 40 # Damos tiempo a Spring Boot para iniciar
          docker ps
          
          # Verificación de salud (Healthchecks manuales)
          echo "Verificando Auth Server (9000)..."
          curl -f http://localhost:9000/.well-known/openid-configuration || exit 1
          
          echo "Verificando Resource Server (8080)..."
          # El resource server suele devolver 401 si no hay token, lo cual cuenta como "vivo"
          curl -I http://localhost:8080/resource/user 
          
          echo "Verificando Frontend (4200)..."
          curl -f http://localhost:4200 || exit 1

      - name: Shutdown
        if: always()
        run: docker-compose down