name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar sintaxis PHP
        run: |
          # Buscamos archivos .php y verificamos que no tengan errores de sintaxis
          find . -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Construir imagen Docker
        run: docker build . -t mi-app-poc:latest

      - name: Desplegar aplicación
        run: |
          echo "Iniciando despliegue en entorno de pruebas..."
          docker run -d -p 8080:80 mi-app-poc:latest
          sleep 5
          echo "Despliegue completado con éxito. Contenedor activo."