name: CI/CD Pipeline - Project POC

on:
  push:
    branches: [ "main" ] # Se activa al mergear ramas a main
  pull_request:
    branches: [ "main" ] # Se activa al crear PRs hacia main

jobs:
  # ------------------------------------------------------------------
  # JOB 1: BACKEND AUTH
  # ------------------------------------------------------------------
  build-auth-server:
    name: Build Auth Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Grant execute permission for mvnw
        run: chmod +x authorization-server/mvnw
      - name: Build Authorization Server
        run: cd authorization-server && ./mvnw clean package -DskipTests

  # ------------------------------------------------------------------
  # JOB 2: BACKEND RESOURCE
  # ------------------------------------------------------------------
  build-resource-server:
    name: Build Resource Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Grant execute permission for mvnw
        run: chmod +x resource-server/mvnw
      - name: Build Resource Server
        run: cd resource-server && ./mvnw clean package -DskipTests

  # ------------------------------------------------------------------
  # JOB 3: FRONTEND ANGULAR
  # ------------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ag-prueba-front/package-lock.json
      - name: Install Dependencies
        run: cd ag-prueba-front && npm ci
      # Nota: Asegúrate de tener configurado un script de 'lint' en tu package.json
      - name: Build Angular Production
        run: cd ag-prueba-front && npm run build -- --configuration=production

  # ------------------------------------------------------------------
  # JOB 4: DEPLOY (Uso de tus Dockerfiles y start.sh)
  # ------------------------------------------------------------------
  deploy:
    needs: [build-auth-server, build-resource-server, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from Secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
      - name: Execute start.sh (Docker Build & Start)
        run: |
          chmod +x start.sh
          ./start.sh &
          sleep 30
          docker ps
      - name: Verify Health
        run: |
          curl -f http://localhost:9000/.well-known/openid-configuration || exit 1
          echo "🎉 Deployment for Iteration 3 successful!"