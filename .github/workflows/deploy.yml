name: CI/CD Quality Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-assurance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: actions/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Instalar dependencias (Composer)
        run: composer install --prefer-dist --no-progress

      - name: Análisis de Código Estático y Linting
        run: ./vendor/bin/phpcs --standard=PSR12 index.php || echo "Warnings de estilo detectados (No bloqueante para POC)"

      - name: Ejecutar Pruebas Unitarias
        run: ./vendor/bin/phpunit tests

      - name: Construir Imagen Docker (Solo si pasa calidad)
        run: docker build . -t mi-app-poc:latest

      - name: Despliegue Simulado
        run: echo "Calidad verificada. Desplegando..."