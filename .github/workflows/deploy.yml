name: CI/CD Pipeline - Project POC

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Usamos secrets para no exponer credenciales en el repositorio
      - name: Crear archivo .env
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Ejecutamos el script start.sh que ya tienes configurado
      - name: Validar Construcción con Docker Compose
        run: |
          chmod +x start.sh
          ./start.sh & 
          # Esperamos un momento para validar que los servicios arrancan
          sleep 60 
          docker ps

      - name: Verificación de salud de los servicios
        run: |
          echo "Verificando Auth Server..."
          curl -f http://localhost:9000/.well-known/openid-configuration || exit 1
          echo "Verificando Frontend..."
          curl -f http://localhost:4200 || exit 1

      - name: Limpieza de contenedores
        run: docker-compose down