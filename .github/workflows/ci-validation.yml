name: CI Pipeline - Project POC

on:
  pull_request:
    branches: [ "main" ]

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Cache para acelerar futuras descargas de dependencias

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-prueba-front/package-lock.json

      - name: Angular Lint
        run: |
          cd ag-prueba-front
          npm ci --legacy-peer-deps # Instalación limpia usando el lockfile
          npm run lint

      - name: Java Static Analysis (Auth Server)
        run: |
          cd authorization-server
          chmod +x mvnw
          ./mvnw checkstyle:check spotbugs:check

      - name: Java Static Analysis (Resource Server)
        run: |
          cd resource-server
          chmod +x mvnw
          ./mvnw checkstyle:check spotbugs:check

      - name: Cleanup Environment
        run: |
          docker compose down -v --remove-orphans
          # Limpia imágenes huérfanas para asegurar una build limpia
          docker image prune -f

      - name: Create .env from Secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || 'dummy-id' }}" > .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET || 'dummy-secret' }}" >> .env

      - name: Build and Start Containers
        run: |
          chmod +x start.sh
          ./start.sh # Ejecuta: docker compose up --build

      - name: Verify Services Health
        run: |
          echo "Esperando a que los contenedores estabilicen (60s)..."
          sleep 60
          curl -f http://localhost:4200/ || exit 1
          
          echo "🎉 Docker integration successful!"
      