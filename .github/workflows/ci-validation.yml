name: CI - Full Validation (Build & Test)

on:
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Verificación de Backend (Tests Unitarios)
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [authorization-server, resource-server]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Tests
        # Ejecutamos los tests de Spring Boot
        run: cd ${{ matrix.service }} && ./mvnw test 

  # 2. Verificación de Frontend
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ag-prueba-front/package-lock.json
      - name: Install & Lint
        run: |
          cd ag-prueba-front
          npm ci
          # npm run lint # Opcional si tienes ESLint configurado
      - name: Build Check
        run: cd ag-prueba-front && npm run build -- --configuration=production

  # 3. VERIFICACIÓN DE INTEGRACIÓN (Smoke Test)
  integration-verification:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Mock Env
        # Creamos un .env temporal para que Docker no falle en la nube
        run: |
          echo "GOOGLE_CLIENT_ID=mock_id" > .env
          echo "GOOGLE_CLIENT_SECRET=mock_secret" >> .env
      - name: Lift Environment (Docker)
        # Usamos tu comando exacto del start.sh
        run: docker-compose up --build -d 
      - name: Wait and Healthcheck
        # Verificamos que los puertos clave respondan
        run: |
          sleep 40 # Tiempo para que Spring Boot arranque
          echo "Verificando Auth Server (9000)..."
          curl -f http://localhost:9000/.well-known/openid-configuration || exit 1
          echo "Verificando Frontend (4200)..."
          curl -f http://localhost:4200 || exit 1