name: CI/CD Pipeline - Project POC

on:
  pull_request:
    branches: [ "main" ]

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Cleanup Environment
        run: |
          docker compose down -v --remove-orphans
          # Limpia imágenes huérfanas para asegurar una build limpia
          docker image prune -f

      - name: Create .env from Secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || 'dummy-id' }}" > .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET || 'dummy-secret' }}" >> .env

      - name: Build and Start Containers
        run: |
          chmod +x start.sh
          ./start.sh # Ejecuta: docker compose up --build

      - name: Verify Services Health
        run: |
          echo "Esperando a que los servicios estabilicen..."
          sleep 40
          
          # 1. Verificar Auth Server (Basado en OpenID Config)
          curl -f http://localhost:9000/.well-known/openid-configuration || exit 1
          
          # 2. Verificar Resource Server 
          # Nota: Como no tienes Actuator en pom.xml, probamos un endpoint real. 
          # Devolverá 401 (Unauthorized) pero confirma que el App Server responde.
          curl -i http://localhost:8080/resource/user | grep "HTTP/1.1 401" || exit 1
          
          # 3. Verificar Frontend (Nginx respondiendo en el puerto mapeado)
          curl -f http://localhost:4200/ || exit 1
          
          echo "🎉 Docker integration successful!"