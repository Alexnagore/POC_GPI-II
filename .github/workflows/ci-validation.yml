name: CI/CD Pipeline - Project POC

on:
  pull_request:
    branches: [ "main" ] # Se activa al mergear ramas a main

jobs:
  # ------------------------------------------------------------------
  # JOB 1: BACKEND AUTH (Paralelo)
  # ------------------------------------------------------------------
  build-auth-server:
    name: Build Auth Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build Jar
        run: |
          chmod +x authorization-server/mvnw
          cd authorization-server && ./mvnw clean package -DskipTests

  # ------------------------------------------------------------------
  # JOB 2: BACKEND RESOURCE (Paralelo)
  # ------------------------------------------------------------------
  build-resource-server:
    name: Build Resource Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build Jar
        run: |
          chmod +x resource-server/mvnw
          cd resource-server && ./mvnw clean package -DskipTests

  # ------------------------------------------------------------------
  # JOB 3: FRONTEND ANGULAR (Paralelo)
  # ------------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ag-prueba-front/package-lock.json
      - name: Install & Build
        run: |
          cd ag-prueba-front
          npm ci
          npm run build -- --configuration=production

  # ------------------------------------------------------------------
  # JOB 4: DEPLOY (En tu ordenador local)
  # ------------------------------------------------------------------
  deploy:
    needs: [build-auth-server, build-resource-server, build-frontend]
    runs-on: self-hosted # <--- CAMBIADO para que use tu WSL local
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from Secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
      - name: Execute start.sh
        run: |
          chmod +x start.sh
          ./start.sh # Ejecuta: docker-compose up --build --remove-orphans
      - name: Verify Health
        run: |
          sleep 30
          # Verificamos el Auth Server en el puerto 9000
          curl -f http://localhost:9000/.well-known/openid-configuration || exit 1
          echo "🎉 Deployment for Iteration 3 successful!"