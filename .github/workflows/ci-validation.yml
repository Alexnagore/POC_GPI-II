name: CI Pipeline - Project POC

on:
  pull_request:
    branches: [ "main" ]

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      # 1. Configuración de Entornos
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-prueba-front/package-lock.json

      # 2. Auditoría de Seguridad (Reducir librerías sin actualizar)
      - name: Security Audit (SCA)
        continue-on-error: true
        run: |
          echo "Checking Frontend..."
          cd ag-prueba-front && npm audit
          echo "Checking Backend..."
          cd ../authorization-server && ./mvnw dependency-check:check
          cd ../resource-server && ./mvnw dependency-check:check

      # 3. Tests y Cobertura (Objetivo c%)
      - name: Unit Tests & Coverage
        continue-on-error: true
        run: |
          echo "Angular Tests..."
          cd ag-prueba-front && npm ci --legacy-peer-deps && npm run test:ci
          echo "Java Tests..."
          cd ../authorization-server && ./mvnw test
          cd ../resource-server && ./mvnw test

      # 4. Análisis Estático (Objetivo r% y Code Smell)
      - name: Static Analysis
        continue-on-error: true
        run: |
          echo "Linting Angular..."
          cd ag-prueba-front && npm run lint
          echo "Analizando Java..."
          cd ../authorization-server && ./mvnw checkstyle:check spotbugs:check
          cd ../resource-server && ./mvnw checkstyle:check spotbugs:check

      # 5. Preparación y Despliegue (Docker)
      - name: Cleanup Environment
        run: |
          docker compose down -v --remove-orphans
          docker image prune -f

      - name: Create .env from Secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || 'dummy-id' }}" > .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET || 'dummy-secret' }}" >> .env

      - name: Build and Start Containers
        run: |
          chmod +x start.sh
          ./start.sh 

      # 6. Verificación Final
      - name: Verify Services Health
        run: |
          echo "Esperando a que los contenedores estabilicen (60s)..."
          sleep 60
          curl -f http://localhost:4200/ || exit 1
          echo "🎉 Análisis completo y despliegue exitosos!"